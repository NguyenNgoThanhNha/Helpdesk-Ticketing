# Chạy toàn bộ: docker compose up --build   →  FE http://localhost:8081 · API http://localhost:8080/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Helpdesk@12345}"
    ports: ["14330:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=HelpdeskDb;User Id=sa;Password=${SA_PASSWORD:-Helpdesk@12345};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-compose-demo-secret-key-change-me-0123456789}"
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
      Cors__Origins__0: "http://localhost:8081"
      Ticketing__FrontendBaseUrl: "http://localhost:8081"
    ports: ["8080:8080"]
    volumes: [uploads:/app/App_Data]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8081:80"]

volumes:
  sqldata:
  uploads:
